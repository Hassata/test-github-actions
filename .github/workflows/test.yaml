name: test-actions

on:
    push:

jobs:
    build-image:
        name: "test"
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses:  actions/checkout@v4
            - name: setup the java version
              uses:  actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
            - name: test-it
              run: ./mvnw verify

    docker-build-push:
        name: Build & Push Docker Image
        runs-on: ubuntu-latest
        needs: build-image
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                project_id: 'adesso-gcp-demo-dev'
                workload_identity_provider: 'projects/1095451677236/locations/global/workloadIdentityPools/github/providers/my-repo'

            - name: push to registry
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ghcr.io/hassata/demo:v1
                
