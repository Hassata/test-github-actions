name: test-actions

on:
    push:

jobs:
    build-image:
        name: "test"
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses:  actions/checkout@v4
            - name: setup the java version
              uses:  actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
            - name: test-it
              run: ./mvnw verify 
    docker-build-push:
        name: Build & Push Docker Image
        runs-on: ubuntu-latest
        needs: build-image
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Set image name
              run: echo "IMAGE=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

            - name: push to registry
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ env.IMAGE }}:v1
